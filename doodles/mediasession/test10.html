<!DOCTYPE html>
<html>
    <head>
        <title>MediaSession Bones</title>
    </head>

    <body>
        <h2>MediaSession Bones</h2>
        <audio id="audio" controls src="./media/start.wma.flac"></audio>
        <br>
        <button onclick="play_audio();">Play</button>
        <button onclick="pause_audio();">Pause</button>
    </body>

    <script>

        // register action handlers for media session events
        if ("mediaSession" in navigator) {

            // play music
            navigator.mediaSession.setActionHandler("play", () => {
                play_audio();
            })

            // pause music
            navigator.mediaSession.setActionHandler("pause", () => {
                pause_audio();
            })

        }

        // adapted from https://stackoverflow.com/a/57272491
        function toBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result?.toString() ?? "");
                reader.onerror = reject;
            });
        }

        async function fetch_data_url(url) {

            // fetch resource
            let res = await fetch(url);

            // get response body as binary data
            let data = await res.blob();

            // create a base64 string from the binary data
            let b64 = await toBase64(data);

            // return url
            return b64;

        }

        async function play_audio() {
            let el_audio = document.getElementById("audio");
            await el_audio.play();

            // now that <audio> is playing, set media session metadata
            if ("mediaSession" in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: "Velkommen",
                    artist: "Stan LePard",
                    album: "Windows XP",
                    artwork: [{
                        src: await fetch_data_url("./media/bliss.jpg"),
                        sizes: "512x512",
                        type: "image/jpeg"
                    }]
                });
            }
        }

        async function pause_audio() {
            let el_audio = document.getElementById("audio");
            await el_audio.pause();
        }
    </script>

</html>
