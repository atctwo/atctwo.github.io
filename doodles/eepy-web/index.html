<!DOCTYPE html>
<html>
    <head>
        <title>BLE Robot Controller</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="style.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    </head> 

    <body>
        <div id="container-main" class="container">
            <h2>BLE Robot Controller</h2>
            <div class="d-flex justify-content-center gap-3">
                <button id="btn-connect" class="btn btn-primary" onclick="ble_start_scan();"><i class="bi bi-bluetooth"></i> Connect</button>
                <button id="btn-disconnect" class="btn btn-primary" onclick="ble_device_disconnect();" disabled>Disconnect</button>
            </div>
            <div id="status-container" class="alert alert-info">
                <div id="status">Press Connect to begin!</div>
            </div>
            <br><br>

            <table id="btn-grid">
                <tr>
                    <td class="btn-grid-td"></td>
                    <td class="btn-grid-td"><button id="btn-led-off" class="btn btn-success btn-dpad" onmousedown="drive_forward();"   ontouchstart="drive_forward();"   onmouseup="drive_stop();" onpointerup="drive_stop();" ontouchend="drive_stop();"><i class="bi bi-arrow-up-short btn-dpad-icon"></i></button></td>
                    <td class="btn-grid-td"></td>
                </tr>
                <tr>
                    <td class="btn-grid-td"><button id="btn-led-off" class="btn btn-success btn-dpad" onmousedown="drive_rot_left();"  ontouchstart="drive_rot_left();"  onmouseup="drive_stop();" onpointerup="drive_stop();" ontouchend="drive_stop();"><i class="bi bi-arrow-counterclockwise btn-dpad-icon"></i></button></td>
                    <td class="btn-grid-td"><button id="btn-led-off" class="btn btn-success btn-dpad" onmousedown="drive_stop();"      ontouchstart="drive_stop();"      onmouseup="drive_stop();" onpointerup="drive_stop();" ontouchend="drive_stop();"><i class="bi bi-stop-fill btn-dpad-icon"></i></button></td>
                    <td class="btn-grid-td"><button id="btn-led-off" class="btn btn-success btn-dpad" onmousedown="drive_rot_right();" ontouchstart="drive_rot_right();" onmouseup="drive_stop();" onpointerup="drive_stop();" ontouchend="drive_stop();"><i class="bi bi-arrow-clockwise btn-dpad-icon"></i></button></td>
                </tr>
                <tr>
                    <td class="btn-grid-td"></td>
                    <td class="btn-grid-td"><button id="btn-led-off" class="btn btn-success btn-dpad" onmousedown="drive_backward();"  ontouchstart="drive_backward();"  onmouseup="drive_stop();" onpointerup="drive_stop();" ontouchend="drive_stop();"><i class="bi bi-arrow-down-short btn-dpad-icon"></i></button></td>
                    <td class="btn-grid-td"></td>
                </tr>
            </table>

            <p class="version fs-6 text-secondary">v1.0.5</p>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
        <script src="ble.js"></script>
    </body>
</html>
